<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
     <link rel="stylesheet" href="./output.css">
</head>
<body>
    <div class="bg-gradient-to-r from-blue-500 to-purple-600 h-screen w-full flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-96">
            <form action="/auth" method="post" class="space-y-6">
                <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Enter OTP</h2>
                
                <div class="space-y-2">
                    <label for="otp" class="block text-sm font-medium text-gray-700">Enter your OTP</label>
                    <input 
                        type="text" 
                        name="otp" 
                        id="otp"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="Enter OTP"
                        required
                    >
                </div>
                <input type="hidden" name="role" value="user">
                <button 
                    type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-300"
                >
                    Verify OTP
                </button>
            </form>
        </div>
    </div>
</body>
</html>
