<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif}
h1,h2,h3,h4,h5,h6{font-family:'Outfit',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
.sb-scroll::-webkit-scrollbar-thumb{background:#1e3a5f}
.page-content{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal-ov{animation:mFade .2s ease}
.modal-pn{animation:mSlide .3s ease-out}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSlide{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast-in{animation:tIn .4s ease-out}
.toast-out{animation:tOut .3s ease-in forwards}
@keyframes tIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@keyframes tOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(100%)}}
.nav-item.active{background:linear-gradient(90deg,rgba(13,148,136,.15) 0%,transparent 100%);border-left:3px solid #0d9488}
.nav-item:not(.active){border-left:3px solid transparent}
.trow{transition:background .15s}.trow:hover{background:#f8fafc}
.scard{transition:transform .2s,box-shadow .2s}.scard:hover{transform:translateY(-2px);box-shadow:0 8px 25px -5px rgba(0,0,0,.1)}
.bpress:active{transform:scale(.97)}
.pulse-d{animation:pls 2s infinite}@keyframes pls{0%,100%{opacity:1}50%{opacity:.4}}
.ndrop{animation:nSlide .2s ease-out}@keyframes nSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.pfill{transition:width .8s ease}
.bpulse{animation:bp 2s infinite}@keyframes bp{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(13,148,136,.15);border-color:#0d9488}
.tt-cell{transition:all .15s}.tt-cell:hover{transform:scale(1.03);z-index:1}
.mob-ov{animation:fadeIn .2s ease}
.gtext{background:linear-gradient(135deg,#0d9488,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

/* ========== TOAST ========== */
function toast(msg, type='success') {
  const icons = {success:'fa-check-circle text-emerald-500',error:'fa-times-circle text-red-500',warning:'fa-exclamation-circle text-amber-500',info:'fa-info-circle text-cyan-500'};
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = 'toast-in bg-white rounded-xl shadow-lg border border-slate-200 p-4 flex items-start gap-3';
  el.innerHTML = `<i class="fas ${icons[type]} mt-0.5"></i><div class="flex-1"><p class="text-sm font-medium text-slate-800">${msg}</p></div><button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xs"></i></button>`;
  box.appendChild(el);
  setTimeout(()=>{el.classList.remove('toast-in');el.classList.add('toast-out');setTimeout(()=>el.remove(),300)},3000);
}

/* ========== HELPERS ========== */
function avatar(name, size='w-9 h-9', text='text-xs') {
  const initials = name.split(' ').map(w=>w[0]).join('').slice(0,2);
  const colors = ['from-primary-500 to-cyan-500','from-violet-500 to-purple-500','from-amber-500 to-orange-500','from-rose-500 to-pink-500','from-emerald-500 to-teal-500','from-blue-500 to-indigo-500'];
  const c = colors[name.length % colors.length];
  return `<div class="${size} rounded-full bg-gradient-to-br ${c} flex items-center justify-center text-white font-semibold ${text} flex-shrink-0">${initials}</div>`;
}
function statusBadge(s) {
  const m = {Active:'bg-emerald-100 text-emerald-700',Inactive:'bg-slate-100 text-slate-600','On Leave':'bg-amber-100 text-amber-700',Paid:'bg-emerald-100 text-emerald-700',Pending:'bg-amber-100 text-amber-700',Partial:'bg-blue-100 text-blue-700',Overdue:'bg-red-100 text-red-700',Completed:'bg-emerald-100 text-emerald-700',Upcoming:'bg-cyan-100 text-cyan-700','Available':'bg-emerald-100 text-emerald-700','Low Stock':'bg-amber-100 text-amber-700','Out of Stock':'bg-red-100 text-red-700',Issued:'bg-blue-100 text-blue-700',Returned:'bg-emerald-100 text-emerald-700',Present:'bg-emerald-100 text-emerald-700',Absent:'bg-red-100 text-red-700',Late:'bg-amber-100 text-amber-700'};
  return `<span class="px-2.5 py-1 rounded-full text-xs font-medium ${m[s]||'bg-slate-100 text-slate-600'}">${s}</span>`;
}
function priorityBadge(p) {
  const m = {high:'bg-red-100 text-red-700',medium:'bg-amber-100 text-amber-700',low:'bg-slate-100 text-slate-600'};
  return `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase ${m[p]||''}">${p}</span>`;
}
function paginate(arr, page, per) { const start=(page-1)*per; return arr.slice(start, start+per); }
function pagControls(total, page, per, fn) {
  const pages = Math.ceil(total/per);
  if(pages<=1) return '';
  let btns = '';
  for(let i=1;i<=pages;i++) btns += `<button onclick="${fn}(${i})" class="w-8 h-8 rounded-lg text-sm font-medium ${i===page?'bg-primary-600 text-white':'text-slate-600 hover:bg-slate-100'}">${i}</button>`;
  return `<div class="flex items-center gap-1">${page>1?`<button onclick="${fn}(${page-1})" class="w-8 h-8 rounded-lg text-sm text-slate-500 hover:bg-slate-100"><i class="fas fa-chevron-left text-xs"></i></button>`:''}${btns}${page<pages?`<button onclick="${fn}(${page+1})" class="w-8 h-8 rounded-lg text-sm text-slate-500 hover:bg-slate-100"><i class="fas fa-chevron-right text-xs"></i></button>`:''}</div>`;
}

function saveStudent(e, id) {
  e.preventDefault();
  const f = new FormData(e.target);
  const data = Object.fromEntries(f);
  if(id) {
    const s = students.find(x=>x.id===id);
    Object.assign(s, data);
    toast('Student updated successfully');
  } else {
    data.id = Math.max(...students.map(s=>s.id))+1;
    data.admission = new Date().toISOString().split('T')[0];
    students.push(data);
    attendanceData[data.id] = {date:attDate, status:'Present'};
    toast('Student added successfully');
  }
  closeModal(); renderPage();
}

function deleteStudent(id) {
  const s = students.find(x=>x.id===id);
  openModal(`
    <div class="p-6 text-center">
      <div class="w-16 h-16 rounded-full bg-red-100 text-red-500 flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-2xl"></i></div>

    </div>
  `);
}
function confirmDeleteStudent(id) { students = students.filter(s=>s.id!==id); delete attendanceData[id]; closeModal(); toast('Student deleted','warning'); renderPage(); }

/* ========== ATTENDANCE ========== */
function renderAttendance() {
  const classStudents = students.filter(s => s.class === attClass && s.status === 'Active').sort((a,b)=>a.roll.localeCompare(b.roll));
  const present = classStudents.filter(s=>attendanceData[s.id]?.status==='Present').length;
  const absent = classStudents.filter(s=>attendanceData[s.id]?.status==='Absent').length;
  const late = classStudents.filter(s=>attendanceData[s.id]?.status==='Late').length;
  const pct = classStudents.length ? Math.round((present/classStudents.length)*100) : 0;

  return `
  <div class="mb-6"><h2 class="font-heading text-2xl font-bold text-slate-900">Attendance</h2><p class="text-slate-500 text-sm mt-1">Mark and manage daily attendance</p></div>
  <div class="bg-white rounded-xl border border-slate-200/60 p-4 mb-4">
    <div class="flex flex-col sm:flex-row gap-3">
      <select class="border border-slate-200 rounded-lg px-3 py-2.5 text-sm text-slate-600 min-w-[150px]" onchange="attClass=this.value;renderPage()">
        ${classes.map(c=>`<option ${attClass===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <input type="date" value="${attDate}" onchange="attDate=this.value;renderPage()" class="border border-slate-200 rounded-lg px-3 py-2.5 text-sm text-slate-600 min-w-[160px]">
      <button onclick="markAllPresent()" class="px-4 py-2.5 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 bpress"><i class="fas fa-check-double mr-2 text-xs"></i>Mark All Present</button>
    </div>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
    <div class="bg-white rounded-xl p-4 border border-slate-200/60 text-center"><p class="text-2xl font-heading font-bold text-emerald-600">${present}</p><p class="text-xs text-slate-500 mt-0.5">Present</p></div>
    <div class="bg-white rounded-xl p-4 border border-slate-200/60 text-center"><p class="text-2xl font-heading font-bold text-red-500">${absent}</p><p class="text-xs text-slate-500 mt-0.5">Absent</p></div>
    <div class="bg-white rounded-xl p-4 border border-slate-200/60 text-center"><p class="text-2xl font-heading font-bold text-amber-500">${late}</p><p class="text-xs text-slate-500 mt-0.5">Late</p></div>
    <div class="bg-white rounded-xl p-4 border border-slate-200/60 text-center"><p class="text-2xl font-heading font-bold text-primary-600">${pct}%</p><p class="text-xs text-slate-500 mt-0.5">Attendance Rate</p></div>
  </div>
  <div class="bg-white rounded-xl border border-slate-200/60 overflow-hidden">
    <table class="w-full text-sm">
      <thead><tr class="bg-slate-50 border-b border-slate-100">
        <th class="text-left px-5 py-3 font-semibold text-slate-600 text-xs uppercase tracking-wider">Student</th>
        <th class="text-left px-5 py-3 font-semibold text-slate-600 text-xs uppercase tracking-wider hidden sm:table-cell">Roll</th>
        <th class="text-center px-5 py-3 font-semibold text-slate-600 text-xs uppercase tracking-wider">Status</th>
      </tr></thead>
      <tbody class="divide-y divide-slate-100">
        ${classStudents.length===0?'<tr><td colspan="3" class="px-5 py-10 text-center text-slate-400">No students in this class</td></tr>':
        classStudents.map(s=>{
          const st = attendanceData[s.id]?.status || 'Present';
          return `<tr class="trow">
            <td class="px-5 py-3.5"><div class="flex items-center gap-3">${avatar(s.name,'w-8 h-8','text-[10px]')}<span class="font-medium text-slate-800">${s.name}</span></div></td>
            <td class="px-5 py-3.5 hidden sm:table-cell text-slate-600">${s.roll}</td>
            <td class="px-5 py-3.5"><div class="flex items-center justify-center gap-2">
              ${['Present','Absent','Late'].map(st2=>`<button onclick="attendanceData[${s.id}].status='${st2}';renderPage()" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${st===st2?'text-white shadow-sm':'text-slate-500 hover:bg-slate-100'} ${st===st2?(st2==='Present'?'bg-emerald-600':st2==='Absent'?'bg-red-500':'bg-amber-500'):''}">${st2}</button>`).join('')}
            </div></td>
          </tr>`}).join('')}
      </tbody>
    </table>
  </div>
  ${classStudents.length>0?`<div class="mt-4 flex justify-end"><button onclick="toast('Attendance saved successfully for ${attClass}')" class="bpress px-6 py-2.5 bg-primary-600 text-white rounded-xl text-sm font-medium hover:bg-primary-700 shadow-sm shadow-primary-600/20"><i class="fas fa-save mr-2 text-xs"></i>Save Attendance</button></div>`:''}`;
}
function markAllPresent() { students.filter(s=>s.class===attClass&&s.status==='Active').forEach(s=>{if(attendanceData[s.id])attendanceData[s.id].status='Present';}); renderPage(); toast('All marked present','info'); }

function renderResults() {
  const completedExams = exams.filter(e=>e.status==='Completed');

  completedExams.map(e=>{
    const res = results.filter(r=>r.examId===e.id);
    return `<div class="bg-white rounded-xl border border-slate-200/60 overflow-hidden">
      <div class="p-4 border-b border-slate-100 bg-slate-50"><h4 class="font-heading font-semibold text-slate-800">${e.name}</h4><p class="text-xs text-slate-500">${e.class} | ${e.subject} | Max: ${e.maxMarks}</p></div>
      ${res.length===0?'<p class="p-4 text-sm text-slate-400 text-center">No results entered</p>':
      `<table class="w-full text-sm"><thead><tr class="border-b border-slate-100"><th class="text-left px-5 py-2.5 text-xs font-semibold text-slate-500 uppercase">Student</th><th class="text-center px-5 py-2.5 text-xs font-semibold text-slate-500 uppercase">Marks</th><th class="text-center px-5 py-2.5 text-xs font-semibold text-slate-500 uppercase">Percentage</th><th class="text-center px-5 py-2.5 text-xs font-semibold text-slate-500 uppercase">Grade</th></tr></thead><tbody class="divide-y divide-slate-100">

}

  openModal(`<div class="p-6">

      <div class="grid grid-cols-3 gap-3 text-center"><div><p class="text-xs text-slate-500">Total</p><p class="font-bold text-slate-800">${f.amount.toLocaleString()}</p></div><div><p class="text-xs text-slate-500">Paid</p><p class="font-bold text-emerald-600">${f.paid.toLocaleString()}</p></div><div><p class="text-xs text-slate-500">Due</p><p class="font-bold text-red-600">${f.due.toLocaleString()}</p></div></div>

      <div><label class="block text-sm font-medium text-slate-700 mb-1">Payment Amount *</label><input name="amount" type="number" min="1" max="${f.due}" value="${f.due}" required class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-medium text-slate-700 mb-1">Payment Method</label><select name="method" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm"><option>Cash</option><option>Online Transfer</option><option>UPI</option><option>Cheque</option><option>Card</option></select></div>

function processPayment(e, feeId) {
  e.preventDefault(); const f = new FormData(e.target); const amt = parseInt(f.get('amount'));
  const fee = fees.find(x=>x.id===feeId);
  fee.paid += amt; fee.due -= amt;
  fee.status = fee.due <= 0 ? 'Paid' : 'Partial';
  closeModal(); toast(`Payment of ${amt.toLocaleString()} processed successfully`); renderPage();
}

function saveBook(e) { e.preventDefault(); const f=new FormData(e.target); const d=Object.fromEntries(f); d.id=Math.max(0,...books.map(x=>x.id))+1; d.copies=parseInt(d.copies); d.available=d.copies; d.status='Available'; books.push(d); closeModal(); toast('Book added'); renderPage(); }

function openIssueModal(bookId) {
  const b = books.find(x=>x.id===bookId);
  const classStudents = students.filter(s=>s.status==='Active');
  openModal(`<div class="p-6">
    <div class="flex items-center justify-between mb-6"><h3 class="font-heading text-lg font-bold text-slate-900">Issue Book</h3><button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-400"><i class="fas fa-times"></i></button></div>
    <div class="bg-slate-50 rounded-xl p-4 mb-5"><p class="font-medium text-slate-800">${b.title}</p><p class="text-xs text-slate-500">${b.author} | Available: ${b.available}</p></div>
    <form onsubmit="issueBook(event,${bookId})" class="space-y-4">
      <div><label class="block text-sm font-medium text-slate-700 mb-1">Student *</label><select name="studentId" required class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm">${classStudents.map(s=>`<option value="${s.id}">${s.name} (${s.class}-${s.section})</option>`).join('')}</select></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-slate-700 mb-1">Issue Date *</label><input name="issueDate" type="date" value="${new Date().toISOString().split('T')[0]}" required class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm"></div>
        <div><label class="block text-sm font-medium text-slate-700 mb-1">Due Date *</label><input name="dueDate" type="date" value="${new Date(Date.now()+30*86400000).toISOString().split('T')[0]}" required class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm"></div>
      </div>
      <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50">Cancel</button><button type="submit" class="bpress flex-1 px-4 py-2.5 bg-primary-600 text-white rounded-xl text-sm font-medium hover:bg-primary-700">Issue Book</button></div>
    </form></div>`);
}
function issueBook(e, bookId) {
  e.preventDefault(); const f=new FormData(e.target); const d=Object.fromEntries(f);
  d.id=Math.max(0,...issuedBooks.map(x=>x.id))+1; d.bookId=bookId; d.studentId=parseInt(d.studentId); d.returnDate=null; d.status='Issued';
  issuedBooks.push(d);
  const book=books.find(b=>b.id===bookId); book.available--; book.status=book.available===0?'Out of Stock':book.available<=5?'Low Stock':'Available';
  closeModal(); toast('Book issued successfully'); renderPage();
}
function returnBook(ibId) {
  const ib=issuedBooks.find(x=>x.id===ibId); ib.returnDate=new Date().toISOString().split('T')[0]; ib.status='Returned';
  const book=books.find(b=>b.id===ib.bookId); book.available++; book.status=book.available<=5?'Low Stock':'Available';
  toast('Book returned successfully'); renderPage();
}

function saveNotice(e, id) {

  else { d.id=Math.max(0,...notices.map(x=>x.id))+1; d.date=new Date().toISOString().split('T')[0]; notices.unshift(d); toast('Notice published'); }
  closeModal(); renderPage();

function showSettingsTab(tab) {
  document.querySelectorAll('.sett-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.sett-tab').forEach(el => {
    el.classList.remove('border-primary-600','bg-primary-50','text-primary-700','font-medium');
    el.classList.add('border-transparent','text-slate-600');
  });
  const tabMap = {school:'settSchool',academic:'settAcademic',profile:'settProfile',appearance:'settAppearance'};
  const target = document.getElementById(tabMap[tab]);
  if(target) target.classList.remove('hidden');
  const btn = document.querySelector(`.sett-tab[data-tab="${tab}"]`);
  if(btn) {
    btn.classList.add('border-primary-600','bg-primary-50','text-primary-700','font-medium');
    btn.classList.remove('border-transparent','text-slate-600');
  }
}

/* ========== INIT ========== */
function init() {
  renderNav();
  renderPage();
  // Keyboard shortcut: Ctrl+K for search
  document.addEventListener('keydown', e => {
    if((e.ctrlKey||e.metaKey) && e.key==='k') {
      e.preventDefault();
      const gs = document.getElementById('globalSearch');
      if(gs) gs.focus();
    }
    if(e.key==='Escape') {
      closeModal();
      document.getElementById('notifDrop').classList.add('hidden');
      document.getElementById('profDrop').classList.add('hidden');
    }
  });
}

init();
</script>
</body>
</html>
